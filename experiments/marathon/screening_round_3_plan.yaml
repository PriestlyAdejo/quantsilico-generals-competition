round_id: SH-R3-SEEDS
programme: MARATHON_REDESIGN_LOCKED_V1
stage: STAGE_4A
status: PREDECLARED

purpose: >
  Third successive-halving round. SH-R2 (EV-0028) left all three horizon
  geometries surviving with <10% telemetry differences — single-seed
  screening cannot separate them. SH-R3 asks the reproducibility question:
  do the surviving geometries' training-health signals hold across multiple
  seeds? Screening telemetry still cannot answer gameplay strength
  (EV-0021 draw regime); finalists receive promotion-scale Stage-2 paired
  evaluation afterwards.

compute_class: GPU_RUNPOD_A40
compute_note: >
  Runner reset-pool fix validated by CPU A/B (EV-0029): collect wall for
  3 updates at 8x16 dropped 273s -> 22.8s. Steady GPU TPS for SH-R3 arms
  is measured from the arms' own telemetry (not the 7,611 warm-only ladder
  figure) and recorded in each run record. Pod restart/creation on demand;
  stopped immediately after the round (RUNPOD-SPEND-2026-08-15 section 7).

