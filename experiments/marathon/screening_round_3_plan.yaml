seed_note: >
  Seed 20260815 per geometry is inherited from the SH-R2 runs themselves
  (registered evidence), giving 3 seeds per geometry without re-running it.

screening_metrics_predeclared:
  primary:
    - VLOSS_REDUCTION_OVER_ROUND   # VLOSS_FIRST - VLOSS_LAST over the arm's updates
    - VALID_LEARNING_SHARE         # share of updates finite with 0.5<=ratio<=2
    - ENTROPY_HEALTH               # final entropy >= 0.05 and finite throughout
  secondary:
    - PG_MAGNITUDE
    - TPS_MEASURED                 # steady collect/e2e TPS from telemetry, post pool-fix
elimination_rules_predeclared:
  - any non-finite metric (NaN/Inf) in any update -> immediate elimination (INTEGRITY_FAILURE)
  - VALID_LEARNING_SHARE < 0.9 -> elimination
  - entropy collapse: final entropy < 0.05 -> elimination
  - VLOSS_REDUCTION_OVER_ROUND <= 0 -> elimination
  - GEOMETRY_DROPPED: >
      a geometry whose seeds do not ALL survive (or whose surviving seeds
      flip the vloss-reduction sign vs SH-R2) is dropped as a family
      before SH-R4
stop_rules:
  - fixed 60-update budget per arm
  - wall cap 2h per arm; exceeding with budget incomplete recorded as PARTIAL_BUDGET
  - no early stopping for performance reasons (integrity stops only)
  - arms run SEQUENTIALLY on a single A40 (each arm ~39 GiB VRAM)

promotion_path:
  - geometries passing cross-seed consistency advance to SH-R4 with larger
    budgets (>=200 updates) at the surviving geometry only
  - finalists receive promotion-scale seat-swapped paired evaluation
  - champion promotion only via EV-0017 evaluator with programme.yaml margins

evidence_links: [EV-0015, EV-0016, EV-0017, EV-0021, EV-0027, EV-0028, EV-0029]
