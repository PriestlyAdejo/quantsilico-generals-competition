schema_version: "1.0.0"
kind: MARATHON_SCREENING_ROUND_PLAN
round_id: REWARD-SHAPING-R2
programme: MARATHON_REDESIGN_LOCKED_V1
stage: STAGE_4A
family: REWARD_INTEGRITY_PROGRESS_PRESSURE
status: PREDECLARED
ppo_semantics: UNCHANGED  # serving/action selection untouched; training-reward ablation only

purpose: >
  Successor to REWARD-SHAPING-R1 (VOID, EV-0046): R1's knobs were signal-vacuous
  in the fresh-window screening regime (army totals stay exactly symmetric in
  32-tick windows; no combat). land_potential breaks that symmetry - land
  asymmetry arises from the first captures of every game (verified 42%
  nonzero ticks; 197/512 nonzero rewards through the full collect path).
  Hypothesis: land-progress pressure (return-invariant potential shaping)
  improves learner-health-preserving vloss reduction and shifts the regime
  toward decisive play without harming learner health.

hypothesis_predeclared: >
  LAND-POTENTIAL improves learner-health-preserving vloss reduction at least
  as well as control at matched transitions; any advancement is
  TELEMETRY-GRADE ONLY - gameplay evaluation remains the promotion arbiter.
  DECISIVE_SHARE and reward-signal density are recorded as mechanism
  diagnostics; they are NOT advancement criteria.

knob:
  implementation: train/competition_native_jax/reward_shaping_jax.py (land_potential mode)
  wiring: rollout_selfplay_jax.py (trained-seat reward only) + run_sh_r1_arm.py
  land_potential: >
    Phi(s) = log(own land + 1) - log(opponent land + 1); alive ticks get
    Phi(s') - Phi(s), terminal ticks get -Phi(s) (Phi(terminal) := 0).
    Return-invariant at gamma=1 (unit-proven, EV-0046): provably preserves
    the optimal policy while supplying expansion-progress signal in the
    screening regime.

arms:
  # CONTROL and LAND-POTENTIAL x seeds {20260825, 20260827} - same seeds as
  # R1 for direct paired comparison against the preserved R1 control arms
  - {arm_id: RSH2-A0-CONTROL-S1, reward_shape: none, reward_shape_beta: 0.0, seed: 20260825}
  - {arm_id: RSH2-A0-CONTROL-S2, reward_shape: none, reward_shape_beta: 0.0, seed: 20260827}
  - {arm_id: RSH2-A1-LAND-S1, reward_shape: land_potential, reward_shape_beta: 1.0, seed: 20260825}
  - {arm_id: RSH2-A1-LAND-S2, reward_shape: land_potential, reward_shape_beta: 1.0, seed: 20260827}

protocol:
  geometry: {num_envs: 256, rollout_len: 32}      # matched R1 geometry
  budget_transitions: 1966080                      # 240 updates per arm
  checkpoint: MARATHON_BASELINE_V0 (hash-verified, EV-0013/0015)
  min_generals_distance: 17                        # competition default for ALL arms
  compute: RunPod A40, remote self-stop wrapper (scripts/dev/remote_orchestrator_with_stop.sh)
  integrity_stops: any non-finite metric or ratio outside [0.5, 2.0] -> INTEGRITY_FAILURE

screening_metrics_predeclared:
  - VLOSS_REDUCTION_OVER_ROUND
  - VALID_LEARNING_SHARE (>= 0.9 required)
  - ENTROPY_LAST (>= 0.05, no collapse)
  - RATIO bounds via healthy() as in CURR1/TOPADV
  - DECISIVE_SHARE_FIRST/LAST (mechanism diagnostic ONLY)

advancement_rules_predeclared:
  - LAND-POTENTIAL ADVANCES only if BOTH seeds survive integrity AND its mean
    vloss-reduction beats the control mean with no sign flip across seeds
  - control survival is REQUIRED; if the control fails, the round is VOID for
    advancement and re-run is predeclared
  - control arms must additionally reproduce the preserved R1 control metrics
    (bit-exact pipeline determinism check; any divergence is an integrity flag)
  - sub-1% margins are recorded as TELEMETRY-GRADE ONLY (EV-0036 precedent)
  - advancement NEVER promotes: Stage-2 gameplay evaluation is the arbiter
  - "reward-hack surveillance predeclared at gameplay eval: advancing
    candidates must show wins achieved by legal captures with zero agent
    faults; degenerate win patterns invalidate the candidate, not the family"
  - no post-hoc rule changes; a modified round requires a NEW plan

evidence_links: [EV-0013, EV-0015, EV-0035, EV-0036, EV-0038, EV-0039, EV-0043, EV-0044, EV-0046]
