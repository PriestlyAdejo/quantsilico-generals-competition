purpose: >
  Promotion-scale seat-swapped paired gameplay evaluation of the two
  curriculum variants that advance under the predeclared
  curriculum_round_1_plan.yaml promotion_path (both beat the control mean
  vloss-reduction across seeds with no sign flip: A2-FAR-21 +0.87%,
  A1-CLOSE-8 +0.06%; EV-0036). The margins are telemetry-grade only, so
  this evaluation is the honest arbiter: either a variant converts its
  screening edge into gameplay strength, or the family closes like the
  horizon family (EV-0035 draw regime). Serving sanity probe is a standing
  precondition (EV-0034).

