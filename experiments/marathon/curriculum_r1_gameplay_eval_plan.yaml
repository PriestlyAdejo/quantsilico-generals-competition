  namespace: marathon-eval-v1

decision_rules_predeclared:
  - a variant PROMOTES over an opponent only if the EV-0017 confidence
    sequence rejects non-superiority at the programme.yaml margin
  - draws at truncation count per the evaluator's bounded-outcome model
    (EV-0021); a draws-only result is UNRESOLVED, not a win
  - if neither variant separates from the control or the baseline, the
    curriculum family R1 closes as a clean negative and the programme
    advances to the next canonical family (no silent promotion, no post-hoc
    margin relaxation)
  - additional pairs require a NEW predeclared plan

