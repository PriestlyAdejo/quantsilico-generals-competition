schema_version: "1.0.0"
kind: MARATHON_SCREENING_ROUND_PLAN
round_id: REWARD-SHAPING-R1
programme: MARATHON_REDESIGN_LOCKED_V1
stage: STAGE_4A
family: REWARD_INTEGRITY_PROGRESS_PRESSURE
status: PREDECLARED
ppo_semantics: UNCHANGED  # serving/action selection untouched; training-reward ablation only

purpose: >
  Reward-integrity / progress-pressure screening round. EV-0035/38/39/43
  accumulation: FIVE independent 2M-transition PPO lines all land at exact
  draw parity; the pinned competition engine reward is purely terminal
  (+1/-1/0), so in a near-100% draw regime the policy gradient receives
  almost no signal. WIN CONVERSION is the binding constraint. Hypothesis: a
  bounded, non-terminal progress signal converts draw parity into wins
  without harming learner health and without reward hacking.

hypothesis_predeclared: >
  KILL-DELTA and/or POTENTIAL improve learner-health-preserving vloss
  reduction at least as well as control at matched transitions, and any
  advancement is TELEMETRY-GRADE ONLY - gameplay evaluation remains the
  promotion arbiter (draws at truncation are UNRESOLVED, not wins). The
  DECISIVE_SHARE diagnostic (fraction of rollout ticks that terminate by
  capture) is recorded as mechanism evidence; it is NOT an advancement
  criterion and can never promote anything by itself.

knob:
  implementation: train/competition_native_jax/reward_shaping_jax.py
  wiring: rollout_selfplay_jax.py (trained-seat reward only) + run_sh_r1_arm.py
  modes:
    none: identity control path (byte-identical rewards)
    kill_delta: >
      r' = r + beta * (opponent army lost - own army lost) on strictly-alive
      ticks; zero-sum symmetric; terminal/truncation ticks keep the engine
      reward untouched.
    potential: >
      potential-based shaping (Ng et al. 1999) at gamma=1.0 with
      Phi(s) = log(own army total + 1) - log(opponent army total + 1);
      alive ticks get Phi(s') - Phi(s), terminal ticks get -Phi(s)
      (Phi(terminal) := 0). Return-invariant: provably preserves the optimal
      policy - the theory-clean progress signal (unit-verified, EV-0044).

arms:
  # CONTROL, KILL-DELTA, POTENTIAL x seeds {20260825, 20260827}
  - {arm_id: RSH-A0-CONTROL-S1, reward_shape: none, reward_shape_beta: 0.0, seed: 20260825}
  - {arm_id: RSH-A0-CONTROL-S2, reward_shape: none, reward_shape_beta: 0.0, seed: 20260827}
  - {arm_id: RSH-A1-KILL-DELTA-S1, reward_shape: kill_delta, reward_shape_beta: 0.01, seed: 20260825}
  - {arm_id: RSH-A1-KILL-DELTA-S2, reward_shape: kill_delta, reward_shape_beta: 0.01, seed: 20260827}
  - {arm_id: RSH-A2-POTENTIAL-S1, reward_shape: potential, reward_shape_beta: 1.0, seed: 20260825}
  - {arm_id: RSH-A2-POTENTIAL-S2, reward_shape: potential, reward_shape_beta: 1.0, seed: 20260827}

beta_predeclaration:
  kill_delta: >
    0.01 keeps one-tick shaping increments <= ~1.0 (board army totals are
    O(100) late-game) while the terminal payoff stays +-1.0 - progress
    pressure without overwhelming the win/loss signal.
  potential: >
    1.0 on log-ratio increments: per-tick army-total swings are fractions of
    a nat; bounded by construction and return-invariant at any beta, so 1.0
    is the natural scale.

protocol:
  geometry: {num_envs: 256, rollout_len: 32}      # matched CURR1/TOPADV geometry
  budget_transitions: 1966080                      # 240 updates per arm
  checkpoint: MARATHON_BASELINE_V0 (hash-verified, EV-0013/0015)
  min_generals_distance: 17                        # competition default for ALL arms
  compute: RunPod A40, remote self-stop wrapper (scripts/dev/remote_orchestrator_with_stop.sh)
  integrity_stops: any non-finite metric or ratio outside [0.5, 2.0] -> INTEGRITY_FAILURE

screening_metrics_predeclared:
  - VLOSS_REDUCTION_OVER_ROUND
  - VALID_LEARNING_SHARE (>= 0.9 required)
  - ENTROPY_LAST (>= 0.05, no collapse)
  - RATIO bounds via healthy() as in CURR1/TOPADV
  - DECISIVE_SHARE_FIRST/LAST (mechanism diagnostic ONLY, never a promotion criterion)

advancement_rules_predeclared:
  - a variant ADVANCES only if BOTH seeds survive integrity AND its mean
    vloss-reduction beats the control mean with no sign flip across seeds
  - control survival is REQUIRED for the round to answer anything; if the
    control fails, the round is VOID for advancement and re-run is predeclared
  - sub-1% margins are recorded as TELEMETRY-GRADE ONLY (EV-0036 precedent)
  - "advancement NEVER promotes: Stage-2 gameplay evaluation is the arbiter"
  - "reward-hack surveillance at gameplay eval (if reached): candidates that
    advance must show wins achieved by legal captures with zero agent faults;
    degenerate win patterns (e.g. self-play artefacts, fault-driven outcomes)
    invalidate the candidate, not the family"
  - no post-hoc rule changes; a modified round requires a NEW plan

evidence_links: [EV-0013, EV-0015, EV-0035, EV-0036, EV-0038, EV-0039, EV-0043]
