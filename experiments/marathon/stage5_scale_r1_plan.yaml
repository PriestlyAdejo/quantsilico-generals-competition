  Is TRANSITION SCALE the binding constraint on win conversion? No canonical
  lineage run under PERSISTENT_EPISODE_REGIME_V1 has ever exceeded the ~2M
  screening budget, and every one of them draws in gameplay (EV-0019/0035/
  0038/0039/0043/0053/0054/0058). The historical 7.59M reference also draws,
  but it predates the corrected regime/lineage reconciliation (EV-0048/0049).
  SCALE-R1 trains the CANONICAL learner (patch transformer, persistent
  regime, identity reward, 256x32 geometry) from MARATHON_BASELINE_V0
  warm-start to 8M transitions per seed and lets the canonical gameplay
  arbiter decide - telemetry is diagnostic only (it has repeatedly failed
  to predict gameplay, EV-0051/0054/0057).

