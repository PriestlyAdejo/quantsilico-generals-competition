authority: >-
  Successor axis after TEACHER-R2 closure (EV-0065 predeclared branch (b)).
  EV-0065's scientific reading: supervised imitation of a win-converting
  teacher transfers KNOWLEDGE (screening gate passed) but not win
  CONVERSION under the student's own on-policy dynamics - the policy
  reverts to the passive-equilibrium draw wall. The untested question is
  whether a policy INITIALIZED at win-converting behaviour and then
  refined ON-POLICY can hold/adapt it. This consumes the TEACHER-R2
  screening-passed dataset through the BC consumption gate's predeclared
  path ("passing checkpoint eligible only as warm-start input for a
  separately predeclared PPO-continuation sub-experiment") with one
  declared engineering difference: the distillation target is the
  canonical transformer (the TEACHER-R2 small CNN cannot warm-start it).
  EXPERT-ITERATION-CLASS intervention per EXECUTION_PLAN Stage 6. No
  launch without registration; no post-hoc rule changes.

question: >-
  Does PPO continued from a teacher-distilled initialization convert wins
  where every fresh-initialization line (2M-16M, all reward shapes,
  capacity, scale) drew? The passive-equilibrium hypothesis predicts the
  draw wall reasserts once on-policy dynamics take over; the expert-init
  hypothesis predicts hunting behaviour persists long enough to convert
  wins against non-hunting opponents.

hypothesis_class: EXPERT_INITIALIZATION_CONTINUATION_V1 (distill -> PPO
  continuation; distillation data OFF_POLICY_AUXILIARY; continuation
  rollouts on-policy; served candidates EVAL_ONLY)

