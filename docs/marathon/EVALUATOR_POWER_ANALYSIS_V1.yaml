authority: additive amendment #2 section 9 (computed from the actual implementation, no invented values)

implementation_audited:
  file: src/generals_bot/marathon_eval/confidence_sequence.py
  method: ANYTIME_VALID_BOUNDED_MIXTURE_CONFIDENCE_SEQUENCE (normal-mixture
    supermartingale on Hoeffding sub-Gaussian bound; observations shifted to
    [0,1]; sigma^2 = 0.25; rho_squared = 1.0; alpha = 0.05; practical margin
