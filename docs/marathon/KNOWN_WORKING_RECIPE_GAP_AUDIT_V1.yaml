scale_interpretation_statement: >-
  The SCALE programme conclusion is scoped to: "scaling the CURRENT recipe from ~2M
  through tested 8M/16M budgets did not yield reproducible promotion." The external
  2026 reference operates at roughly three orders of magnitude more experience with a
  materially larger network and competence curriculum; our 16M bound is a small-scale
  slope test of the current recipe, not a refutation of scale. Large-scale runs must
  still be earned by a working-recipe proof first (amendment sec 16).

