canonical_invariant:
  statement: >-
    ONE canonical rollout/episode-semantics implementation:
    train/competition_native_jax/rollout_selfplay_jax.py (RolloutCarry,
    per-env pool resets, episode continuity, obs/memory threading, old-logprob
    capture, RNG advancement). Experiment runners CONFIGURE these semantics
    (run_sh_r1_arm.py knobs: episode-carry, opponent-mode, curriculum,
    schedules); they MUST NOT implement private copies. This invariant exists
    because the screening runner previously bypassed RolloutCarry and
    reintroduced reset-per-update training (EV-0048).
  guard_status: >-
    STATIC GUARD TEST NOT YET WRITTEN - predeclared as the next
    dependency-safe implementation item (a tests/competition_native_jax test
    asserting: (a) no module outside train/competition_native_jax defines a
    scan-based self-play step over step_batch_jax (grep-style AST guard), and
    (b) run_sh_r1_arm persistent mode threads the carry across >= 2 updates
    with episode state continuity). To be added in a dependency-safe gap;
    must not run against live-training files.

