[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "quantsilico-generals-competition"
version = "0.1.0"
description = "Private QuantSilico repository for the EquiLibre × ÚFAL Generals Competition"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary - All Rights Reserved" }
authors = [{ name = "Priestly Adejo" }]
dependencies = []

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "psutil>=6.0",
  "PyYAML>=6.0",
]
dashboard = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.0",
]
training = [
  "captum>=0.7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["third_party"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
packages = ["generals_bot"]
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
exclude = ["third_party/"]
